version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sports_recruitment_db
    environment:
      POSTGRES_DB: sports_recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sports_recruitment_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sports_recruitment_api
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sports_recruitment
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - sports_recruitment_network
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sports_recruitment_app
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sports_recruitment_network
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:

networks:
  sports_recruitment_network:
    driver: bridge
